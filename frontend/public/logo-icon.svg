<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 52 52" fill="#c8ff00" role="img" aria-label="Cobbra icon">
  <!-- cobblestone / pavé pattern: 4 offset rectangular blocks -->
  <rect x="0"  y="0"  width="24" height="20" rx="3"/>
  <rect x="28" y="0"  width="20" height="24" rx="3"/>
  <rect x="0"  y="24" width="20" height="24" rx="3"/>
  <rect x="24" y="28" width="24" height="20" rx="3"/>
</svg>
