# ── Cobbra Production Nginx ────────────────────────────────────────────────────
# This file is a template. At container startup, ${DOMAIN} is substituted
# via envsubst. All other $variable references below are nginx-native and
# are intentionally left as-is.
#
# IMPORTANT: nginx does NOT inherit server-level add_header directives inside
# location blocks that define their own add_header. To avoid losing security
# headers, the static-asset location ~* is a sibling of location /, not nested.

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens off;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml
        font/woff2;

    # ── Rate limiting (applied to /api/ only) ──────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name ${DOMAIN};

        # Let's Encrypt ACME http-01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ──────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ${DOMAIN};

        # ── TLS certificates (Let's Encrypt) ─────────────────────────────────
        ssl_certificate         /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key     /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;

        # ── TLS settings ──────────────────────────────────────────────────────
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # OCSP stapling
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout    5s;

        # ── Security headers (server level — inherited by all locations below
        #    that do NOT define their own add_header) ──────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;
        # CSP — allows the React SPA to load map tiles (OSM/CARTO), connect to Stripe,
        # and embed Stripe hosted fields. 'unsafe-inline' on style-src is needed for
        # Recharts inline styles and Leaflet dynamic CSS injection.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; font-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

        # ── API → backend ─────────────────────────────────────────────────────
        # Inherits all server-level security headers (no local add_header here).
        location /api/ {
            limit_req zone=api burst=60 nodelay;

            proxy_pass         http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "keep-alive";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            client_max_body_size 50M;
        }

        # ── Static assets — long-lived cache ──────────────────────────────────
        # Vite content-hashes all asset filenames so stale content is impossible.
        # MUST be a sibling of location /, not nested inside it, so that the
        # server-level add_header directives above are NOT active here (nginx
        # drops parent headers when a child block defines its own add_header).
        # We re-add only what matters for binary/font/image responses.
        location ~* \.(js|css|woff2?|ttf|otf|png|jpg|jpeg|svg|ico|webp)$ {
            proxy_pass http://frontend:8080;
            expires    1y;
            add_header Cache-Control         "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── Frontend SPA (catch-all) ───────────────────────────────────────────
        # Inherits all server-level security headers (no local add_header here).
        location / {
            proxy_pass         http://frontend:8080/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
