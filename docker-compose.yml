version: '3.9'

services:
  backend:
    build: ./backend
    container_name: cycling-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:///./data/cycling.db
      - CORS_ORIGINS=http://localhost,http://localhost:80
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: cycling-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
